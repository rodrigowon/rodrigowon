<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ryo Runner - README mini game simulation</title>
  <desc id="desc">Animated pixel-art game banner for a GitHub profile README. A developer character runs, jumps over bugs, collects skills and gains experience.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.42" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect y="0" width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>

    <style>
      .font { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .tiny { font-size: 14px; }
      .small { font-size: 18px; }
      .medium { font-size: 22px; }
      .large { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
      .hud { fill: #dbeafe; font-weight: 700; }
      .muted { fill: #94a3b8; }
      .neon { fill: #67e8f9; filter: url(#glow); }
      .green { fill: #86efac; }
      .yellow { fill: #fde047; }
      .pink { fill: #f0abfc; }
      .red { fill: #fb7185; }
      .tile { fill: #1f2937; stroke: #334155; stroke-width: 2; }
      .tileTop { fill: #22c55e; }
      .tileSide { fill: #14532d; }
      .coin { fill: #facc15; stroke: #fef08a; stroke-width: 3; filter: url(#softGlow); }
      .particle { fill: #67e8f9; opacity: 0.9; }

      #world { animation: worldMove 7s linear infinite; }
      #farWorld { animation: farMove 16s linear infinite; }
      #player { animation: playerJump 1.4s ease-in-out infinite; transform-origin: 150px 236px; }
      #shadow { animation: shadowPulse 1.4s ease-in-out infinite; transform-origin: 150px 276px; }
      #bug1 { animation: bugMove 3.2s linear infinite; }
      #bug2 { animation: bugMove2 5.1s linear infinite; }
      #coinA { animation: coinFloat 1.2s ease-in-out infinite; transform-origin: 520px 152px; }
      #coinB { animation: coinFloat 1.35s ease-in-out infinite; transform-origin: 680px 108px; }
      #coinC { animation: coinFloat 1.1s ease-in-out infinite; transform-origin: 820px 166px; }
      #skillPython { animation: skillPop 2.6s ease-in-out infinite; transform-origin: 310px 177px; }
      #skillSql { animation: skillPop 3.1s ease-in-out infinite; transform-origin: 620px 215px; }
      #skillJs { animation: skillPop 3.8s ease-in-out infinite; transform-origin: 760px 245px; }
      #xpBar { animation: xpFill 4.5s ease-in-out infinite; transform-origin: 0 0; }
      #cursor { animation: blink 1s steps(2, end) infinite; }
      #statusLive { animation: livePulse 1.3s ease-in-out infinite; }
      #clouds { animation: cloudMove 22s linear infinite; }
      .codeLine { animation: lineGlow 3s ease-in-out infinite; }
      .spark1 { animation: spark 1.4s ease-in-out infinite; }
      .spark2 { animation: spark 1.8s ease-in-out infinite; }
      .spark3 { animation: spark 2.1s ease-in-out infinite; }

      @keyframes worldMove {
        from { transform: translateX(0); }
        to { transform: translateX(-420px); }
      }

      @keyframes farMove {
        from { transform: translateX(0); }
        to { transform: translateX(-210px); }
      }

      @keyframes playerJump {
        0%, 100% { transform: translateY(0); }
        42% { transform: translateY(-48px); }
        64% { transform: translateY(-48px); }
      }

      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: .28; }
        42%, 64% { transform: scaleX(.62); opacity: .12; }
      }

      @keyframes bugMove {
        from { transform: translateX(840px); }
        to { transform: translateX(-390px); }
      }

      @keyframes bugMove2 {
        from { transform: translateX(1180px); }
        to { transform: translateX(-490px); }
      }

      @keyframes coinFloat {
        0%, 100% { transform: translateY(0) rotateY(0deg); }
        50% { transform: translateY(-10px) rotateY(55deg); }
      }

      @keyframes skillPop {
        0%, 100% { transform: translateY(0) scale(1); opacity: .86; }
        50% { transform: translateY(-7px) scale(1.04); opacity: 1; }
      }

      @keyframes xpFill {
        0% { width: 96px; }
        50% { width: 225px; }
        100% { width: 155px; }
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }

      @keyframes livePulse {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      @keyframes cloudMove {
        from { transform: translateX(0); }
        to { transform: translateX(-260px); }
      }

      @keyframes lineGlow {
        0%, 100% { opacity: .35; }
        50% { opacity: .9; }
      }

      @keyframes spark {
        0%, 100% { opacity: .15; transform: scale(.75); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <rect width="1000" height="340" rx="26" fill="url(#bg)"/>
  <rect x="12" y="12" width="976" height="316" rx="20" fill="url(#panel)" stroke="#263244" stroke-width="2"/>
  <rect x="12" y="12" width="976" height="316" rx="20" fill="url(#scanlines)"/>

  <!-- Header / HUD -->
  <g class="font">
    <text x="36" y="54" class="large neon">RYO RUNNER</text>
    <text x="39" y="82" class="small muted">README mini-game simulation • building, debugging, leveling up</text>

    <rect x="712" y="30" width="245" height="52" rx="12" fill="#020617" stroke="#1e3a8a"/>
    <circle cx="736" cy="56" r="7" fill="#22c55e" id="statusLive"/>
    <text x="752" y="62" class="small hud">STATUS: CODANDO</text>

    <text x="37" y="116" class="small green">HP ♥♥♥</text>
    <text x="132" y="116" class="small yellow">COINS: 42</text>
    <text x="260" y="116" class="small pink">LEVEL: FULLSTACK</text>

    <rect x="36" y="130" width="260" height="16" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect id="xpBar" x="40" y="134" width="155" height="8" rx="4" fill="#22d3ee"/>
    <text x="310" y="145" class="tiny muted">XP: aprendendo + entregando</text>
  </g>

  <!-- Parallax background -->
  <g id="farWorld">
    <g id="clouds" opacity="0.8">
      <path d="M90 150 C105 126 132 126 145 147 C166 136 190 149 190 170 H74 C68 158 76 150 90 150Z" fill="#1e293b"/>
      <path d="M480 118 C501 88 544 96 550 129 C576 114 608 132 609 160 H452 C442 141 457 120 480 118Z" fill="#1e293b"/>
      <path d="M810 150 C828 124 866 132 871 158 C900 142 932 162 925 186 H788 C779 171 789 153 810 150Z" fill="#1e293b"/>
      <path d="M1120 118 C1141 88 1184 96 1190 129 C1216 114 1248 132 1249 160 H1092 C1082 141 1097 120 1120 118Z" fill="#1e293b"/>
    </g>

    <path d="M0 278 C80 220 150 230 230 278 C320 198 420 206 515 278 C610 215 710 230 790 278 C875 216 965 220 1050 278 H0Z" fill="#0f172a"/>
    <path d="M360 278 C440 220 510 230 590 278 C680 198 780 206 875 278 C970 215 1070 230 1150 278 C1235 216 1325 220 1410 278 H360Z" fill="#0f172a"/>
  </g>

  <!-- Moving world -->
  <g id="world">
    <!-- Ground repeated -->
    <g>
      <rect x="0" y="278" width="130" height="30" class="tileTop"/>
      <rect x="0" y="308" width="130" height="34" class="tileSide"/>
      <rect x="132" y="278" width="130" height="30" class="tileTop"/>
      <rect x="132" y="308" width="130" height="34" class="tileSide"/>
      <rect x="264" y="278" width="130" height="30" class="tileTop"/>
      <rect x="264" y="308" width="130" height="34" class="tileSide"/>
      <rect x="396" y="278" width="130" height="30" class="tileTop"/>
      <rect x="396" y="308" width="130" height="34" class="tileSide"/>
      <rect x="528" y="278" width="130" height="30" class="tileTop"/>
      <rect x="528" y="308" width="130" height="34" class="tileSide"/>
      <rect x="660" y="278" width="130" height="30" class="tileTop"/>
      <rect x="660" y="308" width="130" height="34" class="tileSide"/>
      <rect x="792" y="278" width="130" height="30" class="tileTop"/>
      <rect x="792" y="308" width="130" height="34" class="tileSide"/>
      <rect x="924" y="278" width="130" height="30" class="tileTop"/>
      <rect x="924" y="308" width="130" height="34" class="tileSide"/>
      <rect x="1056" y="278" width="130" height="30" class="tileTop"/>
      <rect x="1056" y="308" width="130" height="34" class="tileSide"/>
      <rect x="1188" y="278" width="130" height="30" class="tileTop"/>
      <rect x="1188" y="308" width="130" height="34" class="tileSide"/>
      <rect x="1320" y="278" width="130" height="30" class="tileTop"/>
      <rect x="1320" y="308" width="130" height="34" class="tileSide"/>
    </g>

    <!-- platforms -->
    <g>
      <rect x="330" y="205" width="115" height="22" rx="4" class="tile"/>
      <rect x="620" y="235" width="140" height="22" rx="4" class="tile"/>
      <rect x="945" y="200" width="120" height="22" rx="4" class="tile"/>
      <rect x="1210" y="225" width="130" height="22" rx="4" class="tile"/>
    </g>

    <!-- code lines as scenery -->
    <g class="font tiny">
      <text x="355" y="191" fill="#38bdf8" class="codeLine">while(alive) build();</text>
      <text x="642" y="222" fill="#86efac" class="codeLine">SELECT skills FROM dev;</text>
      <text x="960" y="187" fill="#f0abfc" class="codeLine">git commit -m "level up"</text>
    </g>

    <!-- skills -->
    <g id="skillPython" class="font">
      <rect x="282" y="150" width="96" height="36" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="300" y="174" class="small" fill="#bfdbfe">Python</text>
    </g>

    <g id="skillSql" class="font">
      <rect x="590" y="188" width="70" height="36" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
      <text x="610" y="212" class="small" fill="#bbf7d0">SQL</text>
    </g>

    <g id="skillJs" class="font">
      <rect x="735" y="220" width="58" height="36" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <text x="751" y="244" class="small" fill="#fef08a">JS</text>
    </g>

    <!-- coins -->
    <g id="coinA">
      <circle cx="520" cy="152" r="16" class="coin"/>
      <text x="514" y="159" class="font small" fill="#713f12">$</text>
    </g>
    <g id="coinB">
      <circle cx="680" cy="108" r="14" class="coin"/>
      <text x="675" y="115" class="font small" fill="#713f12">$</text>
    </g>
    <g id="coinC">
      <circle cx="820" cy="166" r="15" class="coin"/>
      <text x="815" y="173" class="font small" fill="#713f12">$</text>
    </g>

    <!-- bugs -->
    <g id="bug1">
      <ellipse cx="0" cy="261" rx="24" ry="18" fill="#fb7185" stroke="#7f1d1d" stroke-width="3"/>
      <circle cx="-8" cy="253" r="4" fill="#fff"/>
      <circle cx="9" cy="253" r="4" fill="#fff"/>
      <circle cx="-7" cy="254" r="2" fill="#111"/>
      <circle cx="10" cy="254" r="2" fill="#111"/>
      <path d="M-22 268 L-38 278 M22 268 L38 278" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
      <text x="-27" y="289" class="font tiny red">BUG</text>
    </g>

    <g id="bug2">
      <ellipse cx="0" cy="261" rx="24" ry="18" fill="#a78bfa" stroke="#4c1d95" stroke-width="3"/>
      <circle cx="-8" cy="253" r="4" fill="#fff"/>
      <circle cx="9" cy="253" r="4" fill="#fff"/>
      <circle cx="-7" cy="254" r="2" fill="#111"/>
      <circle cx="10" cy="254" r="2" fill="#111"/>
      <path d="M-22 268 L-38 278 M22 268 L38 278" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <text x="-30" y="289" class="font tiny pink">TODO</text>
    </g>
  </g>

  <!-- Player and shadow, not moving with world -->
  <ellipse id="shadow" cx="150" cy="286" rx="38" ry="9" fill="#000000" opacity="0.28"/>

  <g id="player">
    <!-- legs -->
    <rect x="128" y="243" width="13" height="36" rx="4" fill="#1d4ed8" stroke="#0f172a" stroke-width="2"/>
    <rect x="154" y="243" width="13" height="36" rx="4" fill="#1d4ed8" stroke="#0f172a" stroke-width="2"/>
    <!-- shoes -->
    <rect x="119" y="273" width="25" height="10" rx="4" fill="#0f172a"/>
    <rect x="151" y="273" width="25" height="10" rx="4" fill="#0f172a"/>
    <!-- body -->
    <rect x="121" y="202" width="54" height="48" rx="10" fill="#2563eb" stroke="#bfdbfe" stroke-width="3"/>
    <rect x="132" y="211" width="32" height="10" rx="5" fill="#60a5fa"/>
    <!-- head -->
    <rect x="126" y="164" width="48" height="44" rx="12" fill="#f8c59c" stroke="#7c2d12" stroke-width="3"/>
    <rect x="121" y="155" width="58" height="18" rx="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="158" y="178" width="7" height="9" rx="2" fill="#111827"/>
    <rect x="135" y="192" width="22" height="5" rx="2" fill="#7c2d12"/>
    <!-- backpack/code terminal -->
    <rect x="87" y="202" width="32" height="38" rx="6" fill="#020617" stroke="#67e8f9" stroke-width="2"/>
    <rect x="94" y="212" width="18" height="4" fill="#22c55e"/>
    <rect x="94" y="222" width="12" height="4" fill="#facc15"/>
  </g>

  <!-- Sparks -->
  <g filter="url(#glow)">
    <circle class="particle spark1" cx="206" cy="185" r="4"/>
    <circle class="particle spark2" cx="232" cy="220" r="3"/>
    <circle class="particle spark3" cx="180" cy="143" r="3"/>
    <circle class="particle spark1" cx="880" cy="112" r="3"/>
    <circle class="particle spark2" cx="930" cy="230" r="4"/>
  </g>

  <!-- Terminal footer -->
  <g class="font">
    <rect x="36" y="296" width="415" height="26" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="52" y="315" class="tiny" fill="#86efac">$ npm run dreams -- --mode=production</text>
    <rect id="cursor" x="426" y="303" width="10" height="14" fill="#86efac"/>
  </g>
</svg>
